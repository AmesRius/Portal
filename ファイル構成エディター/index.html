<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown File Tree Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      gap: 16px;
      user-select: none;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* GitHub入力エリア */
    .github-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .github-input-group {
      display: flex;
      gap: 8px;
    }

    .github-input-group input {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px 12px;
      color: #f1f5f9;
      font-size: 0.875rem;
      outline: none;
    }

    .github-input-group input:focus {
      border-color: #0284c7;
    }

    .status-msg {
      font-size: 0.8rem;
      min-height: 1.2em;
    }

    .status-msg.error { color: #f87171; }
    .status-msg.success { color: #4ade80; }
    .status-msg.info { color: #38bdf8; }

    /* メインエリア */
    .container {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 0;
      position: relative;
    }

    .panel {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 150px;
      user-select: auto;
    }

    #input-panel {
      flex: 1;
    }

    #output-panel {
      flex: 1;
    }

    /* パネル間のリサイズバー (スプリッター) */
    .resizer {
      width: 12px;
      cursor: col-resize;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      margin: 0 -2px;
    }

    .resizer::after {
      content: "";
      width: 4px;
      height: 32px;
      background-color: #475569;
      border-radius: 2px;
      transition: background-color 0.2s, height 0.2s;
    }

    .resizer:hover::after,
    .resizer.is-dragging::after {
      background-color: #38bdf8;
      height: 48px;
    }

    /* 最大化モード用のスタイル */
    .container.maximized-input #output-panel,
    .container.maximized-input #resizer {
      display: none;
    }

    .container.maximized-input #input-panel {
      flex: 1 1 100% !important;
    }

    .panel-header {
      background-color: #0f172a;
      padding: 10px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #334155;
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-active {
      background-color: #0284c7;
      color: #ffffff;
    }

    textarea, pre {
      flex: 1;
      width: 100%;
      height: 100%;
      padding: 16px;
      background-color: transparent;
      border: none;
      color: #f1f5f9;
      font-family: "Fira Code", "Consolas", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      overflow: auto;
      white-space: pre;
    }

    textarea::placeholder {
      color: #64748b;
    }

    pre {
      color: #38bdf8;
      user-select: all;
    }
  </style>
</head>
<body>

  <header>
    <h1>Markdown ディレクトリ構造ジェネレーター</h1>
    <p class="subtitle">インデントテキストの自動変換、またはGitHubリポジトリURLからの読み込みに対応しています。</p>
  </header>

  <!-- GitHub URL インプットエリア -->
  <section class="github-card">
    <div class="github-input-group">
      <input type="text" id="github-url" placeholder="GitHub URL または owner/repo（例: https://github.com/facebook/react）">
      <button id="fetch-github" class="btn">GitHubから取得</button>
    </div>
    <div id="status-msg" class="status-msg"></div>
  </section>

  <!-- エディタエリア -->
  <main class="container" id="container">
    <!-- 入力パネル -->
    <section class="panel" id="input-panel">
      <div class="panel-header">
        <span>入力（インデントテキスト）</span>
        <div class="btn-group">
          <button id="maximize-btn" class="btn btn-secondary" title="入力エリアを画面一杯に拡大します">最大化</button>
          <button id="load-sample" class="btn btn-secondary">サンプル</button>
        </div>
      </div>
      <textarea id="input" placeholder="my-project&#10;  src&#10;    index.js&#10;    style.css&#10;  package.json" spellcheck="false"></textarea>
    </section>

    <!-- ドラッグリサイズ用スプリッター -->
    <div class="resizer" id="resizer"></div>

    <!-- 出力パネル -->
    <section class="panel" id="output-panel">
      <div class="panel-header">
        <span>出力（Markdownプレビュー）</span>
        <button id="copy-btn" class="btn">コードをコピー</button>
      </div>
      <pre><code id="output"></code></pre>
    </section>
  </main>

  <script>
    const container = document.getElementById('container');
    const inputPanel = document.getElementById('input-panel');
    const outputPanel = document.getElementById('output-panel');
    const resizer = document.getElementById('resizer');
    const maximizeBtn = document.getElementById('maximize-btn');

    const inputArea = document.getElementById('input');
    const outputArea = document.getElementById('output');
    const copyBtn = document.getElementById('copy-btn');
    const loadSampleBtn = document.getElementById('load-sample');
    
    const githubInput = document.getElementById('github-url');
    const fetchBtn = document.getElementById('fetch-github');
    const statusMsg = document.getElementById('status-msg');

    const sampleText = `my-app
  src
    assets
      logo.png
    components
      Header.jsx
      Footer.jsx
    App.jsx
    main.jsx
  public
    favicon.ico
  .gitignore
  package.json
  README.md`;

    // ----------------------------------------------------
    // 1. パネル拡大・リサイズ（ドラッグ）処理
    // ----------------------------------------------------
    let isDragging = false;

    // リサイズドラッグ開始
    resizer.addEventListener('mousedown', (e) => {
      isDragging = true;
      resizer.classList.add('is-dragging');
      document.body.style.cursor = 'col-resize';
    });

    // ドラッグ中
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const containerRect = container.getBoundingClientRect();
      const relativeX = e.clientX - containerRect.left;
      
      // 最小幅の制限（150px）
      const minWidth = 150;
      const maxWidth = containerRect.width - minWidth;

      if (relativeX >= minWidth && relativeX <= maxWidth) {
        const leftPercent = (relativeX / containerRect.width) * 100;
        const rightPercent = 100 - leftPercent;

        inputPanel.style.flex = `0 0 ${leftPercent}%`;
        outputPanel.style.flex = `0 0 ${rightPercent}%`;
      }
    });

    // ドラッグ終了
    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove('is-dragging');
        document.body.style.cursor = '';
      }
    });

    // 最大化ボタンの切り替え
    maximizeBtn.addEventListener('click', () => {
      const isMaximized = container.classList.toggle('maximized-input');
      
      if (isMaximized) {
        maximizeBtn.textContent = '元に戻す';
        maximizeBtn.classList.remove('btn-secondary');
        maximizeBtn.classList.add('btn-active');
      } else {
        maximizeBtn.textContent = '最大化';
        maximizeBtn.classList.remove('btn-active');
        maximizeBtn.classList.add('btn-secondary');
      }
    });


    // ----------------------------------------------------
    // 2. ツリー構造変換ロジック
    // ----------------------------------------------------
    function parseToTree(text) {
      const lines = text.split('\n').filter(line => line.trim().length > 0);
      if (lines.length === 0) return '';

      const items = lines.map(line => {
        const match = line.match(/^[\s\t]*/)[0];
        let indent = 0;
        for (let char of match) {
          indent += (char === '\t') ? 2 : 1;
        }
        return { indent, name: line.trim() };
      });

      const uniqueIndents = [...new Set(items.map(i => i.indent))].sort((a, b) => a - b);
      const indentLevelMap = new Map(uniqueIndents.map((indent, index) => [indent, index]));

      const nodes = items.map(item => ({
        level: indentLevelMap.get(item.indent),
        name: item.name
      }));

      const result = [];

      for (let i = 0; i < nodes.length; i++) {
        const current = nodes[i];

        if (i === 0 || current.level === 0) {
          result.push(current.name);
          continue;
        }

        let prefix = '';
        for (let l = 1; l < current.level; l++) {
          let hasMoreAtLevel = false;
          for (let j = i; j < nodes.length; j++) {
            if (nodes[j].level < l) break;
            if (nodes[j].level === l) {
              hasMoreAtLevel = true;
              break;
            }
          }
          prefix += hasMoreAtLevel ? '│   ' : '    ';
        }

        let isLastSibling = true;
        for (let j = i + 1; j < nodes.length; j++) {
          if (nodes[j].level < current.level) break;
          if (nodes[j].level === current.level) {
            isLastSibling = false;
            break;
          }
        }

        const connector = isLastSibling ? '└── ' : '├── ';
        result.push(prefix + connector + current.name);
      }

      return result.join('\n');
    }

    function updateOutput() {
      const tree = parseToTree(inputArea.value);
      outputArea.textContent = tree ? `\`\`\`\n${tree}\n\`\`\`` : '';
    }

    // ----------------------------------------------------
    // 3. GitHub API 処理
    // ----------------------------------------------------
    function parseGitHubUrl(url) {
      const cleaned = url.trim().replace(/\/+$/, '').replace(/\.git$/, '');
      const urlMatch = cleaned.match(/github\.com\/([^\/]+)\/([^\/]+)/);
      if (urlMatch) return { owner: urlMatch[1], repo: urlMatch[2] };

      const simpleMatch = cleaned.match(/^([^\/]+)\/([^\/]+)$/);
      if (simpleMatch) return { owner: simpleMatch[1], repo: simpleMatch[2] };

      return null;
    }

    function convertPathsToIndentedText(repoName, paths) {
      const root = {};
      
      paths.forEach(path => {
        const parts = path.split('/');
        let current = root;
        parts.forEach(part => {
          if (!current[part]) current[part] = {};
          current = current[part];
        });
      });

      function buildLines(obj, depth = 1) {
        let lines = [];
        const keys = Object.keys(obj).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

        for (const key of keys) {
          lines.push('  '.repeat(depth) + key);
          lines = lines.concat(buildLines(obj[key], depth + 1));
        }
        return lines;
      }

      return [repoName, ...buildLines(root)].join('\n');
    }

    async function fetchGitHubRepo(owner, repo) {
      const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if (repoRes.status === 404) throw new Error('リポジトリが見つかりません（非公開リポジトリの可能性があります）');
      if (repoRes.status === 403) throw new Error('GitHub APIの利用制限に達しました。少し時間を置いてお試しください。');
      if (!repoRes.ok) throw new Error(`通信エラーが発生しました (${repoRes.status})`);
      
      const repoData = await repoRes.json();
      const defaultBranch = repoData.default_branch || 'main';

      const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${defaultBranch}?recursive=1`);
      if (!treeRes.ok) throw new Error('ファイルツリーの取得に失敗しました');

      const treeData = await treeRes.json();
      if (!treeData.tree || treeData.tree.length === 0) throw new Error('リポジトリ内にファイルが存在しません');

      const paths = treeData.tree.map(item => item.path);
      return { repoName: repoData.name, paths, truncated: treeData.truncated };
    }

    function showStatus(msg, type = 'info') {
      statusMsg.textContent = msg;
      statusMsg.className = `status-msg ${type}`;
    }

    // ----------------------------------------------------
    // 4. イベントハンドラ設定
    // ----------------------------------------------------
    fetchBtn.addEventListener('click', async () => {
      const url = githubInput.value;
      if (!url) {
        showStatus('URL または owner/repo を入力してください', 'error');
        return;
      }

      const parsed = parseGitHubUrl(url);
      if (!parsed) {
        showStatus('有効なGitHub URL（例: https://github.com/facebook/react）を入力してください', 'error');
        return;
      }

      fetchBtn.disabled = true;
      fetchBtn.textContent = '取得中...';
      showStatus('GitHubからデータを取得しています...', 'info');

      try {
        const { repoName, paths, truncated } = await fetchGitHubRepo(parsed.owner, parsed.repo);
        const indentedText = convertPathsToIndentedText(repoName, paths);
        inputArea.value = indentedText;
        updateOutput();

        let msg = `「${repoName}」のツリー構造を取得しました！`;
        if (truncated) msg += '（※大規模リポジトリのため一部ファイルが省略されています）';
        showStatus(msg, 'success');
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = 'GitHubから取得';
      }
    });

    githubInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchBtn.click();
    });

    inputArea.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = inputArea.selectionStart;
        const end = inputArea.selectionEnd;
        inputArea.value = inputArea.value.substring(0, start) + '  ' + inputArea.value.substring(end);
        inputArea.selectionStart = inputArea.selectionEnd = start + 2;
        updateOutput();
      }
    });

    inputArea.addEventListener('input', updateOutput);

    loadSampleBtn.addEventListener('click', () => {
      inputArea.value = sampleText;
      githubInput.value = '';
      showStatus('');
      updateOutput();
    });

    copyBtn.addEventListener('click', async () => {
      if (!outputArea.textContent) return;
      try {
        await navigator.clipboard.writeText(outputArea.textContent);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'コピー完了！';
        copyBtn.style.backgroundColor = '#16a34a';
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.backgroundColor = '';
        }, 1500);
      } catch (err) {
        alert('コピーに失敗しました');
      }
    });

    // 初期表示
    inputArea.value = sampleText;
    updateOutput();
  </script>
</body>
</html>
