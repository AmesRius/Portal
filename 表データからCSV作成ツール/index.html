<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表データからCSV作成ツール</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.description {
            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .options {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: normal;
            cursor: pointer;
            margin-bottom: 0;
        }

        .btn-container {
            text-align: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        @media (min-width: 640px) {
            button {
                width: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>表データからCSV作成ツール</h1>
    <p class="description">ExcelやGoogleスプレッドシートの表をコピー（Ctrl+C）し、下のボックスに貼り付け（Ctrl+V）てください。</p>

    <div class="input-group">
        <label for="pasteArea">ここに貼り付け</label>
        <textarea id="pasteArea" placeholder="ここに表データを貼り付けてください..."></textarea>
    </div>

    <div class="options">
        <label>
            <input type="checkbox" id="includeHeader" checked> 1行目をヘッダーとして扱う
        </label>
        <label>
            文字コード: 
            <select id="encoding" style="padding: 0.3rem; border-radius: 4px; border: 1px solid var(--border-color);">
                <option value="utf-8">UTF-8 (BOM付き)</option>
                <option value="sjis">Shift_JIS (Excel用)</option>
            </select>
        </label>
    </div>

    <div class="btn-container">
        <button id="downloadBtn">CSVファイルをダウンロード</button>
    </div>
</div>

<!-- Shift_JIS変換用のライブラリ (Encoding.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.1.0/encoding.min.js"></script>
<script>
    document.getElementById('downloadBtn').addEventListener('click', function() {
        const text = document.getElementById('pasteArea').value.trim();
        
        if (!text) {
            alert('表データが入力されていません。');
            return;
        }

        // タブ区切りの表データをパースする
        const rows = text.split('\n').map(row => {
            return row.split('\t').map(cell => {
                // 前後の空白や不要な改行を削除
                let cleaned = cell.trim();
                // ダブルクォーテーションのエスケープとカンマ・改行を含む場合の囲み処理
                if (cleaned.includes('"') || cleaned.includes(',') || cleaned.includes('\n')) {
                    cleaned = '"' + cleaned.replace(/"/g, '""') + '"';
                }
                return cleaned;
            });
        });

        // CSV形式の文字列に変換
        const csvContent = rows.map(e => e.join(',')).join('\r\n');
        const encoding = document.getElementById('encoding').value;

        let blob;
        if (encoding === 'sjis') {
            // Shift_JISへの変換
            const unicodeList = Encoding.stringToCode(csvContent);
            const sjisCodeList = Encoding.convert(unicodeList, {
                to: 'SJIS',
                from: 'UNICODE'
            });
            blob = new Blob([new Uint8Array(sjisCodeList)], { type: 'text/csv;charset=shift_jis;' });
        } else {
            // UTF-8 (BOM付きでExcel対応)
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        }

        // ダウンロードの実行
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'exported_data.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
